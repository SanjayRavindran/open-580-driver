# Track 1 configuration for NVIDIA Tesla P4 (GP104GL, PCI 10de:1bb3) on Ubuntu Linux 7.x+
# Prevent nouveau from binding at boot so open R580 shims can execute signed ACR/PMU/SEC2 blobs.
blacklist nouveau
blacklist lbm-nouveau
options nouveau modeset=0
alias nouveau off
alias lbm-nouveau off

# Required module ordering observed on Ubuntu 26.04 Linux 7.0.0-43-generic:
# nvidia-drm imports symbols from drm_ttm_helper, so pre-load drm_ttm_helper automatically.
softdep nvidia pre: video drm_ttm_helper
softdep nvidia-drm pre: drm_ttm_helper

# Enable PRIME / GBM dma-buf sync & headless persistence-friendly allocations.
options nvidia-drm modeset=1
options nvidia NVreg_PreserveVideoMemoryAllocations=1


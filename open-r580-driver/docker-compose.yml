services:
  selkies-webtop:
    image: lscr.io/linuxserver/webtop:ubuntu-xfce
    container_name: selkies-webtop
    restart: unless-stopped
    runtime: nvidia
    shm_size: "2gb"
    ports:
      - "3000:3000"
      - "3001:3001"
    devices:
      - /dev/nvidia-modeset:/dev/nvidia-modeset
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-991}"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - DRINODE=/dev/dri/renderD129
      - DRI_NODE=/dev/dri/renderD129
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - "${DOCKER_DATA_ROOT:-/home/zero/docker}/webtop/config:/config"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility, compute, video, graphics, display]

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    runtime: nvidia
    ports:
      - "8096:8096"
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-991}"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - "${DOCKER_DATA_ROOT:-/home/zero/docker}/jellyfin/config:/config"
      - "${DOCKER_DATA_ROOT:-/home/zero/docker}/jellyfin/media:/data/movies"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility, compute, video]


services:
  selkies-webtop:
    image: lscr.io/linuxserver/webtop:ubuntu-xfce
    container_name: selkies-webtop
    restart: unless-stopped
    runtime: nvidia
    shm_size: "2gb"
    ports:
      - "3000:3000"
      - "3001:3001"
    devices:
      - /dev/nvidia-modeset:/dev/nvidia-modeset
      - /dev/dri:/dev/dri
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-991}"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - DRINODE=${DRINODE:-/dev/dri/renderD129}
      - DRI_NODE=${DRI_NODE:-/dev/dri/renderD129}
      - GBM_BACKENDS_PATH=/usr/lib64/gbm:/usr/lib/x86_64-linux-gnu/gbm
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - SELKIES_ENCODER=${SELKIES_ENCODER:-h265enc,h264enc}
      - SELKIES_VIDEO_FULLCOLOR=${SELKIES_VIDEO_FULLCOLOR:-true}
      - SELKIES_VIDEO_10BIT=${SELKIES_VIDEO_10BIT:-true}
      - SELKIES_VIDEO_STREAMING_MODE=true
      - SELKIES_FRAMERATE=${SELKIES_FRAMERATE:-60}
    volumes:
      - "${DOCKER_DATA_ROOT:-/home/zero/docker}/webtop/config:/config"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility, compute, video, graphics, display]

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    runtime: nvidia
    ports:
      - "8096:8096"
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-991}"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-UTC}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    volumes:
      - "${DOCKER_DATA_ROOT:-/home/zero/docker}/jellyfin/config:/config"
      - "${DOCKER_DATA_ROOT:-/home/zero/docker}/jellyfin/media:/data/movies"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility, compute, video]
